- link:
    # Framework checkouts and generated state live outside the dotfiles repo;
    # see README.md. This manifest owns only profile configuration.
    ~/.config/emacs/doom:
      create: true
      path: doom
    ~/.config/emacs/config:
      create: true
      path: config
    ~/.config/emacs/funcs:
      create: true
      path: funcs
    ~/.config/emacs/spacemacs:
      create: true
      path: spacemacs

    ~/.config/emacs/spacemacs-full/config:
      create: true
      path: config
    ~/.config/emacs/spacemacs-full/funcs:
      create: true
      path: funcs
    ~/.config/emacs/spacemacs-full/layers:
      create: true
      path: spacemacs
    ~/.config/emacs/spacemacs-full/init.el:
      create: true
      path: spacemacs/spacemacs_full

    ~/.config/emacs/spacemacs-basic/init.el:
      create: true
      path: spacemacs/spacemacs_basic

    ~/.config/emacs/spacemacs-writing/config:
      create: true
      path: config
    ~/.config/emacs/spacemacs-writing/funcs:
      create: true
      path: funcs
    ~/.config/emacs/spacemacs-writing/layers:
      create: true
      path: spacemacs
    ~/.config/emacs/spacemacs-writing/init.el:
      create: true
      path: spacemacs/spacemacs_writing

    ~/.twittering-mode.gpg: ../../Dropbox/Software/emacs/twittering-mode.gpg
