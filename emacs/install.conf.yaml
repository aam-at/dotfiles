- link:
    # Framework checkouts and generated state live outside the dotfiles repo;
    # see README.md. This manifest owns only profile configuration.
    ~/.config/emacs/doom:
      create: true
      path: doom
    ~/.config/emacs/config:
      create: true
      path: config
    ~/.config/emacs/funcs:
      create: true
      path: funcs

    ~/.config/emacs/spacemacs/config:
      create: true
      force: true
      path: config
    ~/.config/emacs/spacemacs/funcs:
      create: true
      force: true
      path: funcs
    ~/.config/emacs/spacemacs/layers:
      create: true
      force: true
      path: spacemacs
    ~/.config/emacs/spacemacs/init.el:
      create: true
      force: true
      path: spacemacs/init.el
