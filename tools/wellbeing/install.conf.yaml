- defaults:
    link:
      force: true

- link:
    ~/.config/systemd/user/wellbeing.service: wellbeing.service

- shell:
    - [make install, Build and install wellbeing]
    - [systemctl --user daemon-reload, Reload user systemd units]
    - [systemctl --user enable wellbeing.service, Enable wellbeing at login]
    - [systemctl --user try-restart wellbeing.service, Restart wellbeing if running]
