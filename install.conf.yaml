- clean: ["~"]
- shell:
    - [git submodule update --depth 1 --init --recursive, Installing submodules]
    # Quote every value so assignments with embedded newlines remain valid
    # when sourced. The assignment-only format also remains valid for the
    # systemd EnvironmentFile entries that consume this file.
    - [
        "python3 -c 'import os, shlex; print(*(f\"{name}={shlex.quote(value)}\" for name, value in os.environ.items()), sep=\"\\n\")' > ~/.bash_env",
        Environment variables,
      ]
    - [mkdir -p ~/.gnupg && chmod 700 ~/.gnupg, Secure GnuPG home directory]
    - [cd bash/bashmarks && make install, Install bashmarks]
    - [
        chmod +x scripts/*.sh && mkdir -p ~/.local/bin && ln -frs scripts/*
        ~/.local/bin/,
        Link scripts,
      ]
    - [
        tic -x -o ~/.terminfo general/xterm/xterm-24bit.terminfo,
        Configure Truecolor,
      ]
    - [./scripts/health-check.sh, Run health check]
- link:
    # Bash
    ~/.aliases: general/aliases
    ~/.bash-preexec.sh: bash/bash-preexec.sh
    ~/.bash_aliases: bash/bash_aliases
    ~/.bash_completion.d: bash/completions
    ~/.bash_logout: bash/bash_logout
    ~/.bash_profile: bash/bash_profile
    ~/.bashrc: bash/bashrc
    ~/.dircolors: bash/dircolors-solarized/dircolors.ansi-light
    ~/.profile: bash/profile

    # General / X11
    ~/.env: general/env
    ~/.latexmkrc: general/latexmkrc
    ~/.local/share/applications/:
      path: general/applications/*
      glob: true
    ~/.Xmodmap: general/x/Xmodmap
    ~/.Xresources: general/x/Xresources
    ~/.xinitrc: general/x/xinitrc

    # XDG ~/.config apps
    ~/.config/aichat: config/aichat
    ~/.config/alacritty: config/alacritty
    ~/.config/Antigravity IDE/User/:
      create: true
      glob: true
      path: config/code/*
    ~/.config/atuin: config/atuin
    ~/.config/broot: config/broot
    ~/.config/btop: config/btop
    ~/.config/catppuccin: config/catppuccin
    ~/.config/Code/User/:
      create: true
      glob: true
      path: config/code/*
    ~/.config/DankMaterialShell: config/DankMaterialShell
    ~/.config/direnv/direnvrc:
      create: true
      path: config/direnv/direnvrc
    ~/.config/environment.d/50-gnupg-ssh.conf:
      create: true
      path: config/environment.d/50-gnupg-ssh.conf
    ~/.config/fastfetch: config/fastfetch
    ~/.config/fish: config/fish
    ~/.config/ghostty: config/ghostty
    ~/.config/git: config/git
    ~/.config/gitu: config/gitu
    ~/.config/gitui: config/gitui
    ~/.config/helix: config/helix
    # Link each compositor entry so ~/.config/{niri,hypr}/shells remains a
    # real, selector-addressable path for desktop-shell.
    ~/.config/hypr/:
      create: true
      glob: true
      path: config/hypr/*
    ~/.config/kanata: config/kanata
    ~/.config/kitty: config/kitty
    ~/.config/lazygit: config/lazygit
    ~/.config/mimeapps.list: config/mimeapps.list
    ~/.config/neovide: config/neovide
    ~/.config/niri/:
      create: true
      glob: true
      path: config/niri/*
    ~/.config/noctalia: config/noctalia
    ~/.config/nvim: config/lazyvim
    ~/.config/pudb/pudb.cfg:
      create: true
      path: config/python/pudb.cfg
    ~/.config/ranger: config/ranger
    ~/.config/starship.toml: config/starship.toml
    ~/.config/systemd/user/:
      create: true
      glob: true
      path: config/systemd/*
    ~/.config/television: config/television
    ~/.config/tmux: config/tmux
    ~/.config/wezterm: config/wezterm
    ~/.config/xremap: config/xremap
    ~/.config/yazi: config/yazi
    ~/.config/zathura:
      create: true
      path: config/zathura
    ~/.config/zed: config/zed
    ~/.config/zellij: config/zellij

    # GnuPG / SSH / secrets
    ~/.authinfo.gpg: ../Dropbox/Software/authinfo.gpg
    ~/.config/age: ../Dropbox/Software/age
    ~/.gnupg/gpg-agent.conf:
      create: true
      path: config/gnupg/gpg-agent.conf
    ~/.password-store: ../Dropbox/Software/pass
    ~/.ssh/config: config/ssh/config

    # Mail
    ~/.davmail.properties: config/davmail.properties
    ~/.elfeed: ../Dropbox/Software/elfeed
    ~/.mbsyncrc: config/mbsyncrc
    ~/.notmuch-config: config/notmuch/config

    # Coding agents: portable preferences only. Authentication, caches, history,
    # project trust, and machine-specific MCP configuration stay local.
    ~/.codex/config.toml:
      create: true
      path: config/agents/codex/config.toml
    ~/.claude/settings.json:
      create: true
      path: config/agents/claude/settings.json
    ~/.pi/agent/keybindings.json:
      create: true
      path: config/agents/pi/keybindings.json
    ~/.pi/agent/settings.json:
      create: true
      path: config/agents/pi/settings.json
    ~/.omp/agent/config.yml:
      create: true
      path: config/agents/omp/config.yml

    # Other editors / tools
    ~/.ideavimrc: idea/ideavimrc
    ~/.sbclrc: config/sbclrc
    ~/.screenrc: screen/screenrc
    ~/.stumpwmrc: config/stumpwm/stumpwmrc
    ~/.textlintrc: config/textlintrc
    ~/.vale: config/vale/vale
