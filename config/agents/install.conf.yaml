- defaults:
    link:
      force: true

- link:
    # Portable agent preferences only. Authentication, caches, history,
    # project trust, and machine-specific MCP configuration stay local.
    ~/.codex/config.toml:
      create: true
      path: codex/config.toml
    ~/.claude/settings.json:
      create: true
      path: claude/settings.json
    ~/.gemini/config/plugins/compaction-gate:
      create: true
      path: antigravity/plugins/compaction-gate
    # agy's `!` prefix is a shell escape, so `! compaction 750k` reaches this.
    ~/.local/bin/compaction:
      create: true
      path: antigravity/plugins/compaction-gate/hooks/compaction_gate.py
    ~/.gemini/config/plugins/autoapprove:
      create: true
      path: antigravity/plugins/autoapprove
    ~/.local/bin/autoapprove:
      create: true
      path: antigravity/plugins/autoapprove/hooks/autoapprove.py
    ~/.pi/agent/keybindings.json:
      create: true
      path: pi/keybindings.json
    ~/.pi/agent/settings.json:
      create: true
      path: pi/settings.json
    ~/.omp/agent/config.yml:
      create: true
      path: omp/config.yml
