# greetd session chooser for COSMIC, Niri, and Hyprland.
#
# Niri is the fallback. At the login screen, press F3 to choose any installed
# Wayland session from /usr/share/wayland-sessions.
[terminal]
vt = 1

[default_session]
# Built-in animation choices are matrix, doom, and none.  F4 opens tuigreet's
# background selector; Matrix is the default here.  The wrapper adds a battery
# indicator only when the host exposes one.
command = "/usr/local/libexec/tuigreet-login"
user = "greeter"
