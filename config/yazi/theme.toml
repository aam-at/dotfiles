# vim:fileencoding=utf-8:foldmethod=marker

# Gruvbox Dark palette reference:
# dark0=#282828 dark1=#3c3836 dark2=#504945 dark3=#665c54 dark4=#7c6f64
# light0=#fbf1c7 light1=#ebdbb2 light2=#d5c4a1 light3=#bdae93 light4=#a89984
# bright_red=#fb4934 bright_green=#b8bb26 bright_yellow=#fabd2f bright_blue=#83a598
# bright_purple=#d3869b bright_aqua=#8ec07c bright_orange=#fe8019 gray=#928374

[flavor]
dark = ""
light = ""

# : Manager {{{

[mgr]
cwd = { fg = "#b8bb26", bold = true }

# Hovered / search
hovered = { fg = "#282828", bg = "#458588", bold = true }
preview_hovered = { fg = "#83a598", underline = true }
find_keyword = { fg = "#fabd2f", bold = true, italic = true }
find_position = { fg = "#fe8019", bg = "reset", bold = true }
symlink_target = { fg = "#8ec07c", italic = true }

# Marker + counters
marker_selected = { fg = "#282828", bg = "#b8bb26", bold = true }
marker_marked = { fg = "#282828", bg = "#d3869b", bold = true }
marker_copied = { fg = "#282828", bg = "#8ec07c", bold = true }
marker_cut = { fg = "#282828", bg = "#fb4934", bold = true }
count_selected = { fg = "#282828", bg = "#fabd2f", bold = true }
count_copied = { fg = "#282828", bg = "#8ec07c", bold = true }
count_cut = { fg = "#282828", bg = "#fb4934", bold = true }

# Border / syntax
border_symbol = "│"
border_style = { fg = "#504945" }
syntect_theme = ""

# : }}}


# : Tabs {{{

[tabs]
active = { fg = "#282828", bg = "#fabd2f", bold = true }
inactive = { fg = "#d5c4a1", bg = "#3c3836" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#282828", bg = "#83a598", bold = true }
normal_alt = { fg = "#83a598", bg = "#3c3836" }
select_main = { fg = "#282828", bg = "#fabd2f", bold = true }
select_alt = { fg = "#fabd2f", bg = "#3c3836" }
unset_main = { fg = "#282828", bg = "#d3869b", bold = true }
unset_alt = { fg = "#d3869b", bg = "#3c3836" }

# : }}}


# : Status {{{

[status]
overall = { fg = "#ebdbb2", bg = "#282828" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#665c54" }
perm_type = { fg = "#8ec07c" }
perm_read = { fg = "#fabd2f" }
perm_write = { fg = "#fb4934" }
perm_exec = { fg = "#83a598" }
progress_label = { bold = true }
progress_normal = { fg = "#8ec07c", bg = "#282828" }
progress_error = { fg = "#fb4934", bg = "#282828" }

# : }}}


# : Select {{{

[select]
border = { fg = "#d3869b" }
active = { fg = "#282828", bg = "#fabd2f", bold = true }
inactive = { fg = "#d5c4a1" }

# : }}}


# : Confirmation {{{

[confirm]
border = { fg = "#83a598" }
title = { fg = "#fabd2f", bold = true }
content = {}
list = {}
btn_yes = { fg = "#282828", bg = "#8ec07c", bold = true }
btn_no = { fg = "#ebdbb2", bg = "#3c3836" }
btn_labels = ["  [Y]es  ", "  (N)o  "]

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#83a598" }
title = { fg = "#fabd2f", bold = true }
tbl_col = { fg = "#d3869b" }
tbl_cell = { fg = "#282828", bg = "#d5c4a1" }

# : }}}


# : Notification {{{

[notify]
title_info = { fg = "#8ec07c", bold = true }
title_warn = { fg = "#fabd2f", bold = true }
title_error = { fg = "#fb4934", bold = true }
icon_info = ""
icon_warn = ""
icon_error = ""

# : }}}


# : Picker {{{

[pick]
border = { fg = "#83a598" }
active = { fg = "#282828", bg = "#83a598", bold = true }
inactive = { fg = "#d5c4a1" }

# : }}}


# : Input {{{

[input]
border = { fg = "#83a598" }
title = { fg = "#d3869b", bold = true }
value = { fg = "#ebdbb2" }
selected = { fg = "#282828", bg = "#fabd2f", bold = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#83a598" }
active = { fg = "#282828", bg = "#d3869b", bold = true }
inactive = { fg = "#d5c4a1" }
icon_file = ""
icon_folder = ""
icon_command = ""

# : }}}


# : Tasks {{{

[tasks]
border = { fg = "#83a598" }
title = { fg = "#ebdbb2" }
hovered = { fg = "#282828", bg = "#fabd2f", bold = true }

# : }}}


# : Which {{{

[which]
mask = { bg = "#282828" }
cand = { fg = "#83a598" }
rest = { fg = "#928374" }
desc = { fg = "#d3869b" }
separator = "  "
separator_style = { fg = "#928374", bold = true }

# : }}}


# : Help {{{

[help]
on = { fg = "#8ec07c" }
exec = { fg = "#fabd2f" }
desc = { fg = "#d5c4a1" }
hovered = { fg = "#282828", bg = "#83a598", bold = true }
footer = { fg = "#282828", bg = "#ebdbb2" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
  # Images
  { mime = "image/*", fg = "#8ec07c" },

  # Videos / audio
  { mime = "video/*", fg = "#fabd2f" },
  { mime = "audio/*", fg = "#fabd2f" },

  # Archives
  { mime = "application/zip", fg = "#d3869b" },
  { mime = "application/gzip", fg = "#d3869b" },
  { mime = "application/x-tar", fg = "#d3869b" },
  { mime = "application/x-bzip", fg = "#d3869b" },
  { mime = "application/x-bzip2", fg = "#d3869b" },
  { mime = "application/x-7z-compressed", fg = "#d3869b" },
  { mime = "application/x-rar", fg = "#d3869b" },
  { mime = "application/xz", fg = "#d3869b" },

  # Fallback
  { url = "*", fg = "#ebdbb2" },
  { url = "*/", fg = "#83a598" },
]

