# Noctalia v5 profile. Shared Hyprland geometry follows the DMS profile,
# while Noctalia owns the bar, colours, launcher, notifications, and OSDs.
source = ../dms/input.conf
source = ../dms/layout.conf
source = ../dms/decoration.conf
source = ../dms/animations.conf
source = ../dms/rules.conf
source = ../common/binds.conf
source = ../dms/outputs.conf
source = ../dms/misc.conf

exec-once = dbus-update-activation-environment --systemd --all
exec-once = trash-empty 30
exec-once = noctalia

$noctalia = noctalia msg

# DMS-compatible shell controls.
bind = SUPER, Space, exec, $noctalia panel-toggle launcher
bind = SUPER, V, exec, $noctalia panel-toggle clipboard
bind = SUPER, M, exec, $noctalia panel-toggle control-center system
bind = SUPER, N, exec, $noctalia panel-toggle control-center notifications
bind = SUPER, Y, exec, $noctalia panel-toggle wallpaper
bind = SUPER, Comma, exec, $noctalia settings-toggle
bind = SUPER, X, exec, $noctalia panel-toggle session
bind = SUPER ALT, L, exec, $noctalia session lock
bind = CTRL ALT, Delete, exec, $noctalia panel-toggle control-center system

bindel = , XF86AudioRaiseVolume, exec, $noctalia volume-up 3
bindel = , XF86AudioLowerVolume, exec, $noctalia volume-down 3
bindl = , XF86AudioMute, exec, $noctalia volume-mute
bindl = , XF86AudioMicMute, exec, $noctalia mic-mute
bindl = , XF86AudioPause, exec, $noctalia media toggle
bindl = , XF86AudioPlay, exec, $noctalia media toggle
bindl = , XF86AudioPrev, exec, $noctalia media previous
bindl = , XF86AudioNext, exec, $noctalia media next
bindel = , XF86MonBrightnessUp, exec, $noctalia brightness-up 5
bindel = , XF86MonBrightnessDown, exec, $noctalia brightness-down 5

# Noctalia owns the screenshot UI in this profile.
bind = , Print, exec, $noctalia screenshot-region
bind = CTRL, Print, exec, $noctalia screenshot-full
bind = ALT, Print, exec, $noctalia screenshot-window
