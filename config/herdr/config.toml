# Dedicated agent-workspace configuration.  HerdR runs directly in a Kitty OS
# window and complements, rather than replaces, the tmux setup.
onboarding = false

[theme]
name = "gruvbox"

[theme.custom]
accent = "#83a598"
sidebar_bg = "#282828"
active_row_bg = "#3c3836"
selection_bg = "#504945"

[terminal]
default_shell = "fish"
shell_mode = "non_login"
new_cwd = "follow"

[keys]
# This is safe because HerdR is launched outside tmux in its own Kitty window.
prefix = "ctrl+a"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "Open Lazygit"
width = "80%"
height = "80%"

[ui]
sidebar_start_collapsed = false
sidebar_width = 30
status_indicators = "symbols"
window_title = "{hostname}: herdr/{workspace}"

[ui.sidebar.agents]
rows = [
  ["state_icon", "agent", "state_text"],
  ["workspace", "tab"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[session]
resume_agents_on_restore = true

[worktrees]
directory = "~/.herdr/worktrees"

[experimental]
# Persist the workspace and native agent sessions, never pane screen contents.
pane_history = false
allow_nested = false
kitty_graphics = false
