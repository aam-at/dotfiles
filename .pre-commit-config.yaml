repos:
  - repo: local
    hooks:
      - id: fish-indent
        name: fish_indent
        entry: fish_indent -w
        language: system
        files: \.fish$
      - id: prettier-data
        name: prettier (YAML, JSON, and CSS)
        entry: prettier --write
        language: system
        files: \.(ya?ml|json|css)$
      - id: taplo-format
        name: taplo (TOML)
        entry: taplo format
        language: system
        files: \.toml$
      - id: ruff-format
        name: ruff format (Python)
        entry: ruff format
        language: system
        files: \.py$
      - id: shfmt
        name: shfmt (Bash)
        entry: shfmt -w -i 2
        language: system
        files: (^|/)(bashrc|bash_profile|profile|[^/]+\.(bash|sh))$
      - id: emacs-lisp-format
        name: Emacs Lisp formatting
        entry: >-
          emacs --batch --quick --eval '(let ((root default-directory))
          (dolist (file (process-lines "git" "ls-files" "--"
          "*.el" "*.elisp" "*.lisp")) (find-file (expand-file-name file root))
          (emacs-lisp-mode) (indent-region (point-min) (point-max))
          (save-buffer)))'
        language: system
        pass_filenames: false
        always_run: true
      - id: lua-parse
        name: luac (Lua syntax)
        entry: luac -p
        language: system
        files: \.lua$
      - id: theme-generator-check
        name: theme palette generator (drift check)
        entry: >-
          bash -c 'for p in themes/*/palette.toml; do python3
          themes/generate.py "$p" --check || exit 1; done'
        language: system
        pass_filenames: false
        always_run: true
