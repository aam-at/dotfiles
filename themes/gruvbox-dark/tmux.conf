# Native tmux adapter generated from palette.toml.
set -g status-style "fg=#a89984,bg=#282828"
set -g status-left-style "fg=#d5c4a1,bg=#282828"
set -g status-right-style "fg=#a89984,bg=#282828"
set-window-option -g window-status-style "fg=#a89984,bg=#282828"
set-window-option -g window-status-current-style "fg=#282828,bg=#83a598,bold"
set-window-option -g window-status-activity-style "fg=#fabd2f,bg=#282828,underscore"
set-window-option -g window-status-bell-style "fg=#fbf1c7,bg=#cc241d,bold"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#83a598"
set -g message-style "fg=#282828,bg=#fabd2f,bold"
set -g message-command-style "fg=#fabd2f,bg=#282828,bold"
set -g mode-style "fg=#282828,bg=#fabd2f,bold"
set -g clock-mode-colour "#d79921"
